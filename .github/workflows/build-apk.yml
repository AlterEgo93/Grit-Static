name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build web application
        run: npm run build

      - name: 6. Prepare Android Platform & Sync
        run: |
          if [ ! -f "android/settings.gradle" ]; then
            echo "Android directory is missing or incomplete. Recreating clean Android platform..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: 7. Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grit-And-Static-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
