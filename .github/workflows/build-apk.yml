name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Fresh Android Project & Sync
        run: |
          rm -rf android
          npx cap add android
          
          # Inject VIBRATE permission into AndroidManifest.xml
          python3 -c '
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = f.read()
              if "android.permission.VIBRATE" not in data:
                  perm = "    <uses-permission android:name=\"android.permission.VIBRATE\" />\n"
                  data = data.replace("</manifest>", perm + "</manifest>")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(data)
          '
          
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grit-And-Static-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
