name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Set up JDK 17 & Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform, Permissions & Sync
        run: |
          npx cap add android || true
          npx cap sync android
          python3 -c '
import os
manifest_path = "android/app/src/main/AndroidManifest.xml"
if os.path.exists(manifest_path):
    with open(manifest_path, "r", encoding="utf-8") as f:
        content = f.read()
    if "android.permission.VIBRATE" not in content:
        content = content.replace("</manifest>", "    <uses-permission android:name=\"android.permission.VIBRATE\" />\n</manifest>")
        with open(manifest_path, "w", encoding="utf-8") as f:
            f.write(content)
'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grit-And-Static-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
