name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Add Android Platform & Sync
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Inject Android VIBRATE Permission
        run: |
          cat << 'EOF' > update_manifest.py
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = f.read()
              if "android.permission.VIBRATE" not in data:
                  perm = '    <uses-permission android:name="android.permission.VIBRATE" />\n'
                  data = data.replace("</manifest>", perm + "</manifest>")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(data)
                  print("Permission injected successfully")
          EOF
          python3 update_manifest.py

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grit-And-Static-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
