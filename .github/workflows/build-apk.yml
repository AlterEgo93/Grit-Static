name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Install dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build web application
        run: npm run build

      - name: 6. Prepare Android Platform & Sync
        run: |
          rm -rf android
          npx cap add android
          
          python3 -c '
          import os
          path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  data = f.read()
              if "android.permission.VIBRATE" not in data:
                  perm = "    <uses-permission android:name=\"android.permission.VIBRATE\" />\n"
                  data = data.replace("</manifest>", perm + "</manifest>")
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(data)
          '
          
          npx cap sync android

      - name: 7. Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grit-And-Static-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
