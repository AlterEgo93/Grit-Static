name: Build Android APK
# Trigger rebuild v4: Fix BouncyCastle bcprov jar error and setup gradle cache

on:
  push:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 3. Set up JDK 17 (Zulu)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3.5 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false

      - name: 4. Install dependencies
        run: npm install --legacy-peer-deps

      - name: 5. Build web application
        run: npm run build

      - name: 6. Prepare Fresh Android Platform & Configure Gradle
        run: |
          rm -rf android
          npx cap add android

          python3 -c '
          import os

          # 1. Update AndroidManifest.xml
          m_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(m_path):
              with open(m_path, "r", encoding="utf-8") as f:
                  data = f.read()
              perms = [
                  "android.permission.VIBRATE",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.SCHEDULE_EXACT_ALARM",
                  "android.permission.USE_EXACT_ALARM",
                  "android.permission.WAKE_LOCK",
                  "android.permission.RECEIVE_BOOT_COMPLETED"
              ]
              to_add = ""
              for p in perms:
                  if p not in data:
                      to_add += f"    <uses-permission android:name=\"{p}\" />\n"
              if to_add:
                  data = data.replace("</manifest>", to_add + "</manifest>")
                  with open(m_path, "w", encoding="utf-8") as f:
                      f.write(data)

          # 2. Configure gradle.properties with high memory
          p_path = "android/gradle.properties"
          if os.path.exists(p_path):
              with open(p_path, "a", encoding="utf-8") as f:
                  f.write("\norg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8\n")

          # 3. Add resolutionStrategy for bouncycastle in build.gradle
          b_path = "android/build.gradle"
          if os.path.exists(b_path):
              with open(b_path, "r", encoding="utf-8") as f:
                  b_data = f.read()
              rule = """
allprojects {
    configurations.all {
        resolutionStrategy {
            force "org.bouncycastle:bcprov-jdk18on:1.78"
        }
    }
}
"""
              if "resolutionStrategy" not in b_data:
                  b_data += rule
                  with open(b_path, "w", encoding="utf-8") as f:
                      f.write(b_data)
          '

          npx cap sync android

      - name: 7. Build APK with Gradle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m"
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 8. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grit-And-Static-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

